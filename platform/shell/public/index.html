<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <title>Menu</title>
    <style>
      body {
        margin: 0;
        background: #fff;
        color: #1a1a1a;
        font:
          16px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans Arabic',
          sans-serif;
      }
      .dm-boot {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      .dm-boot-note {
        color: #5c5c5c;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121212;
          color: #f2f2f2;
        }
        .dm-boot-note {
          color: #adadad;
        }
      }
    </style>
    <script type="module" src="/boot.js"></script>
  </head>
  <body>
    <div id="app">
      <p class="dm-boot dm-boot-note" role="status">Chargement du menu…</p>
    </div>
    <noscript
      ><p class="dm-boot">
        Activez JavaScript pour voir le menu. · فعّل JavaScript لعرض القائمة.
      </p></noscript
    >
  </body>
</html>
